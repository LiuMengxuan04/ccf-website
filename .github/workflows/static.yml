# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: "17 2 * * *" # daily 10:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CCF catalogue
        run: python scripts/validate_data.py
      - name: Test official CFP adapter
        run: python -m unittest discover -s tests -v
      - name: Restore last valid official snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/hpdc-2027.json
          key: hpdc-2027-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hpdc-2027-v1-
      - name: Refresh official HPDC information
        run: python scripts/refresh_hpdc.py
      - name: Preserve snapshot for future refreshes
        uses: actions/cache/save@v4
        with:
          path: public/data/hpdc-2027.json
          key: hpdc-2027-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js public _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -f .nojekyll ]; then cp .nojekyll _site/; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
